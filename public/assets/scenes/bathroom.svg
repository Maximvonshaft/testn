<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Warm mineral bathroom interior"><defs>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#efe6dc"/><stop offset=".45" stop-color="#c9b29b"/><stop offset="1" stop-color="#8e7460"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8b7360"/><stop offset="1" stop-color="#4e3e34"/></linearGradient>
<linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3ece3"/><stop offset=".58" stop-color="#d6c4b2"/><stop offset="1" stop-color="#aa8e76"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fbff" stop-opacity=".35"/><stop offset="1" stop-color="#9fb0b3" stop-opacity=".15"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#fff8e9" stop-opacity=".95"/><stop offset="1" stop-color="#fff8e9" stop-opacity="0"/></radialGradient>
