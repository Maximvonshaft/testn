name: Recover hybrid visual assets

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/recover-hybrid-assets.yml]
  push:
    branches: [feat/hybrid-visual-system-final]
    paths: [.github/workflows/recover-hybrid-assets.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-hybrid-assets-diagnostics
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hybrid-visual-system-final
          fetch-depth: 0
      - name: Recover persisted chunks and diagnose
        shell: bash
        run: |
          set -u
          git fetch origin feat/hybrid-visual-system-v2:refs/remotes/origin/feat/hybrid-visual-system-v2
          mkdir -p recovered/src/assets-packed qa-evidence
          mapfile -t files < <(git ls-tree -r --name-only origin/feat/hybrid-visual-system-v2 -- src/assets-packed | grep 'visual-bundle\.aqv\.b64\.' | sort || true)
          for path in "${files[@]}"; do
            mkdir -p "recovered/$(dirname "$path")"
            git show "origin/feat/hybrid-visual-system-v2:${path}" > "recovered/${path}"
          done
          {
            echo "recovered_count=${#files[@]}"
            printf '%s\n' "${files[@]}"
          } > qa-evidence/hybrid-asset-recovery.txt
          cp -R recovered/src/assets-packed/. src/assets-packed/ 2>/dev/null || true
          set +e
          node scripts/materialize-visual-assets.mjs > qa-evidence/hybrid-materialize.log 2>&1
          status=$?
          set -e
          echo "materialize_status=${status}" >> qa-evidence/hybrid-asset-recovery.txt
          find recovered/src/assets-packed -type f -maxdepth 1 -printf '%f %s bytes\n' | sort >> qa-evidence/hybrid-asset-recovery.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-asset-recovery-diagnostics
          path: |
            qa-evidence/hybrid-asset-recovery.txt
            qa-evidence/hybrid-materialize.log
            recovered/src/assets-packed/
          if-no-files-found: error
          retention-days: 7
