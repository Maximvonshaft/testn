name: Hybrid main acceptance

on:
  workflow_dispatch:
  push:
    branches: [qa/hybrid-visual-main]
    paths: [.github/workflows/hybrid-main-acceptance.yml]

permissions:
  contents: write

env:
  CI: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/hybrid-visual-main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run full production acceptance
        id: qa
        shell: bash
        run: |
          set +e
          pnpm qa 2>&1 | tee /tmp/hybrid-qa.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          if [[ "${{ steps.qa.outputs.status }}" == "0" ]]; then
            node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readdirSync, readFileSync, statSync, writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          const root = 'public/assets/visual/systems';
          const assets = readdirSync(root).filter((name) => name.endsWith('.avif')).sort().map((name) => {
            const path = join(root, name); const bytes = readFileSync(path);
            return { name, bytes: statSync(path).size, sha256: createHash('sha256').update(bytes).digest('hex') };
          });
          writeFileSync('qa-evidence/acceptance.json', JSON.stringify({
            status: 'passed',
            source: process.env.GITHUB_SHA,
            validatedAt: new Date().toISOString(),
            commands: ['pnpm qa'],
            browserProjects: ['chromium','firefox','webkit','mobile-chrome','mobile-safari'],
            visualAssets: assets
          }, null, 2) + '\n');
          NODE
          else
            cp /tmp/hybrid-qa.log qa-evidence/failure.log
          fi
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-main-acceptance
          path: |
            qa-evidence/
            runtime-artifacts/
            qa-artifacts/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit evidence and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/hybrid-main-acceptance.yml
          git add qa-evidence
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: record hybrid main acceptance"
          git push origin HEAD:qa/hybrid-visual-main
      - name: Enforce acceptance
        if: steps.qa.outputs.status != '0'
        run: exit 1
