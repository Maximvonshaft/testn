          node scripts/materialize-visual-assets.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/assets-packed
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: attach verified hybrid visual bundle"
          git push origin HEAD:feat/hybrid-visual-system-final
