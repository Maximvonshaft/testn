name: Materialize hybrid visual assets

on:
  workflow_dispatch:
  push:
    branches: [feat/hybrid-visual-system-final]
    paths: [.github/workflows/materialize-hybrid-assets.yml]

permissions:
  contents: write

concurrency:
  group: materialize-hybrid-assets
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hybrid-visual-system-final
          fetch-depth: 0
      - name: Attach verified Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/assets-packed
          while read -r path sha; do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/blobs/${sha}" \
              | jq -r .content | base64 -d > "${path}"
          done <<'BLOBS'
          src/assets-packed/visual-bundle.aqv.b64.000 7a906ab33e388fde7924aa30bf5ae830ca63d83a
          src/assets-packed/visual-bundle.aqv.b64.001 b368072186f8ae23c756ec2b96b49514784ac18c
