name: Validate and deploy AQUASTONE website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required production files
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s robots.txt
          test -s sitemap.xml
          test -s site.webmanifest
          grep -q '<main id="main">' index.html
          grep -q 'data-request-form' index.html
          grep -q 'prefers-reduced-motion' styles.css
          grep -q "form.dataset.netlify === 'true'" app.js
          grep -q '\.github\.io' app.js
          node --check app.js
          python -m py_compile qa/browser_smoke.py qa/record_walkthrough.py
      - name: Detect accidental placeholders and secrets
        run: |
          set -euo pipefail
          ! grep -RInE '(sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|TODO:|FIXME:|lorem ipsum)' \
            --exclude-dir=.git --exclude-dir=.github --exclude-dir=qa-artifacts --exclude-dir=runtime-artifacts .

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-qa.txt
      - name: Install browser QA runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-qa.txt
          python -m playwright install --with-deps chromium
      - name: Run desktop and mobile browser acceptance
        run: python qa/browser_smoke.py
      - name: Record desktop and mobile runtime walkthroughs
        run: python qa/record_walkthrough.py
      - name: Upload QA evidence and runtime videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquastone-runtime-qa
          path: |
            qa-artifacts/
            runtime-artifacts/
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: github.event_name != 'pull_request'
    needs: [static-validation, browser-qa]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
