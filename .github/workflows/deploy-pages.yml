name: Validate and deploy AQUASTONE website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  form-hardening:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aquastone-production-website
          fetch-depth: 0
      - name: Support Netlify custom-domain form delivery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          source = path.read_text(encoding='utf-8')
          old = """      const isNetlify = /\\.netlify\\.app$/.test(location.hostname) || document.documentElement.dataset.netlify === 'true';
      if (!isNetlify) {
        event.preventDefault();
        status.textContent = 'This preview has no live form endpoint. Deploy the repository on Netlify to activate secure form delivery.';
        status.dataset.state = 'warning';
        emit('form-unavailable', { hostname: location.hostname });
      }
"""
          new = """      const isUnsupportedPreview =
        location.protocol === 'file:' ||
        /^(localhost|127\\.0\\.0\\.1|\\[::1\\])$/.test(location.hostname) ||
        /\\.github\\.io$/.test(location.hostname);
      const hasNetlifyContract = form.dataset.netlify === 'true';
      if (!hasNetlifyContract || isUnsupportedPreview) {
        event.preventDefault();
        status.textContent = 'This preview has no live form endpoint. Deploy the repository on Netlify to activate secure form delivery.';
        status.dataset.state = 'warning';
        emit('form-unavailable', { hostname: location.hostname });
      }
"""
          if old not in source:
              if "const hasNetlifyContract = form.dataset.netlify === 'true';" in source:
                  raise SystemExit(0)
              raise SystemExit('Form routing block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          node --check app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: support Netlify custom-domain form delivery"
          git push origin HEAD:feat/aquastone-production-website

  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required production files
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s robots.txt
          test -s sitemap.xml
          test -s site.webmanifest
          grep -q '<main id="main">' index.html
          grep -q 'data-request-form' index.html
          grep -q 'prefers-reduced-motion' styles.css
          node --check app.js
      - name: Detect accidental placeholders and secrets
        run: |
          set -euo pipefail
          ! grep -RInE '(sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|TODO:|FIXME:|lorem ipsum)' \
            --exclude-dir=.git --exclude-dir=.github --exclude-dir=qa-artifacts .

  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-qa.txt
      - name: Install browser QA runtime
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-qa.txt
          python -m playwright install --with-deps chromium
      - name: Run desktop and mobile browser acceptance
        run: python qa/browser_smoke.py
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquastone-browser-qa
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: github.event_name != 'pull_request'
    needs: [static-validation, browser-qa]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
