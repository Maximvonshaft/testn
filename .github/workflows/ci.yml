name: AQUASTONE production gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aquastone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SITE_URL: https://preview.aquastone.example
  PUBLIC_SANITY_DATASET: production
  SANITY_STUDIO_PROJECT_ID: ciaccept1
  SANITY_STUDIO_DATASET: production

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Generate hardened candidate lock
        run: pnpm install --lockfile-only
      - name: Upload hardened candidate lock
        uses: actions/upload-artifact@v4
        with:
          name: aquastone-hardened-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7
      - name: Install hardened locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Static production audit
        run: pnpm test:static
      - name: Unit tests
        run: pnpm test:unit
      - name: Astro and TypeScript checks
        run: pnpm check
      - name: Production build
        run: pnpm build
      - name: Sanity Studio build
        run: pnpm --filter aquastone-studio build
      - name: Full production dependency security audit
        shell: bash
        run: |
          set +e
          pnpm audit --prod --json > dependency-audit.json
          status=$?
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('dependency-audit.json', 'utf8'));
          const advisories = Object.values(report.advisories || {});
          for (const advisory of advisories) {
            console.error(`${advisory.severity.toUpperCase()} ${advisory.module_name}: ${advisory.title} (${advisory.vulnerable_versions})`);
          }
          console.error(`Audit totals: ${JSON.stringify(report.metadata?.vulnerabilities || {})}`);
          NODE
          exit "$status"
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquastone-dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aquastone-production-build
          path: dist/
          if-no-files-found: error
          retention-days: 14

  browser-acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aquastone-hardened-lock
          path: .
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install cross-browser runtime
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run Chromium, Firefox, WebKit and mobile acceptance
        run: pnpm test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquastone-browser-acceptance
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
