name: AQUASTONE production gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aquastone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SITE_URL: https://preview.aquastone.example
  PUBLIC_SANITY_DATASET: production

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Static production audit
        run: pnpm test:static
      - name: Unit tests
        run: pnpm test:unit
      - name: Astro and TypeScript checks
        run: pnpm check
      - name: Production build
        run: pnpm build
      - name: Dependency security audit
        run: pnpm audit --prod --audit-level=high
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: aquastone-production-build
          path: dist/
          if-no-files-found: error
          retention-days: 14

  browser-acceptance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install cross-browser runtime
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run Chromium, Firefox, WebKit and mobile acceptance
        run: pnpm test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquastone-browser-acceptance
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
