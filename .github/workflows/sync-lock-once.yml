name: Sync AQUASTONE lockfile once

on:
  push:
    branches: [feat/aquastone-astro-production]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aquastone-lock-sync
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aquastone-astro-production
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Generate deterministic workspace lock
        run: pnpm install --lockfile-only
      - name: Commit lock only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: synchronize production dependency lock'
          git push origin HEAD:feat/aquastone-astro-production
