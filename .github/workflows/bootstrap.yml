name: Materialize AQUASTONE source

on:
  push:
    branches:
      - feat/aquastone-production-website
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: feat/aquastone-production-website
          fetch-depth: 0

      - name: Verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -d .bootstrap
          cat .bootstrap/part-* > /tmp/aquastone-site.tgz.b64
          base64 --decode /tmp/aquastone-site.tgz.b64 > /tmp/aquastone-site.tgz
          tar -tzf /tmp/aquastone-site.tgz >/dev/null
          tar -xzf /tmp/aquastone-site.tgz -C .
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f .github/workflows/deploy-pages.yml

      - name: Materialize normal production source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/deploy-pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize production AQUASTONE website"
          git push origin HEAD:feat/aquastone-production-website
