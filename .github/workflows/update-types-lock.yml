name: Update AQUASTONE Three.js typings

on:
  push:
    branches:
      - feat/aquastone-astro-production

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aquastone-astro-production
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Add Three.js type declarations and regenerate lock
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.devDependencies['@types/three'] = '0.184.1';
          const sorted = Object.fromEntries(Object.entries(pkg.devDependencies).sort(([a], [b]) => a.localeCompare(b)));
          pkg.devDependencies = sorted;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          pnpm install --lockfile-only
          rm -f .github/workflows/update-types-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/update-types-lock.yml
          git commit -m "fix: add strict Three.js type declarations"
          git push origin HEAD:feat/aquastone-astro-production
