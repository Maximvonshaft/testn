name: Verify Cloudflare production

on:
  workflow_dispatch:
  push:
    branches: [qa/hybrid-visual-main]
    paths: [.github/workflows/verify-cloudflare-production.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/hybrid-visual-main
          fetch-depth: 0
      - name: Verify deployed worker and assets
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p qa-evidence
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "Cloudflare repository secrets are unavailable." > qa-evidence/deployment-failure.log
            echo "status=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          worker=$(node -e "const fs=require('fs');const s=fs.readFileSync('wrangler.jsonc','utf8').replace(/^\s*\/\/.*$/gm,'');console.log(JSON.parse(s).name)")
          response=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")
          subdomain=$(printf '%s' "$response" | jq -er '.result.subdomain')
          url="https://${worker}.${subdomain}.workers.dev/en/"
          body=$(mktemp)
          headers=$(mktemp)
          success=0
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 -D "$headers" -o "$body" "$url"; then success=1; break; fi
            sleep 6
          done
          if [[ "$success" != "1" ]] || ! grep -q 'AQUASTONE' "$body" || ! grep -q '/assets/visual/systems/bathroom-desktop.avif' "$body"; then
            { echo "Production page verification failed: ${url}"; cat "$headers"; } > qa-evidence/deployment-failure.log
            echo "status=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          asset_url="https://${worker}.${subdomain}.workers.dev/assets/visual/systems/bathroom-desktop.avif"
          asset_headers=$(mktemp)
          curl -fsSL --max-time 20 -D "$asset_headers" -o /tmp/bathroom-desktop.avif "$asset_url"
          content_type=$(awk 'BEGIN{IGNORECASE=1}/^content-type:/{gsub("\r","");print $2}' "$asset_headers" | tail -1)
          if [[ "$content_type" != image/avif* ]]; then
            echo "Unexpected asset content type: ${content_type}" > qa-evidence/deployment-failure.log
            echo "status=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node - "$worker" "$url" "$asset_url" "$content_type" <<'NODE'
          const fs=require('fs');
          const [worker,url,assetUrl,contentType]=process.argv.slice(2);
          fs.writeFileSync('qa-evidence/deployment.json',JSON.stringify({status:'passed',worker,url,assetUrl,contentType,checkedAt:new Date().toISOString()},null,2)+'\n');
          NODE
          echo "status=0" >> "$GITHUB_OUTPUT"
      - name: Commit evidence and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/verify-cloudflare-production.yml
          git add qa-evidence
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: record Cloudflare production verification"
          git push origin HEAD:qa/hybrid-visual-main
      - name: Enforce deployment verification
        if: steps.verify.outputs.status != '0'
        run: exit 1
