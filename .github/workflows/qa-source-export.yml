name: QA source export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Record source identity
        run: |
          set -euo pipefail
          git rev-parse HEAD > QA_SOURCE_COMMIT.txt
          git status --short > QA_SOURCE_STATUS.txt
      - name: Upload complete source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: aquastone-source-snapshot
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .
            !.git/**
            !node_modules/**
            !dist/**
            !test-results/**
            !playwright-report/**

  bundle-local-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser binaries
        run: pnpm exec playwright install chromium firefox webkit
      - name: Prepare split local runtime bundles
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > QA_SOURCE_COMMIT.txt
          tar \
            --exclude=.git \
            --exclude=dist \
            --exclude=test-results \
            --exclude=playwright-report \
            -czf /tmp/aquastone-node-runtime.tar.gz .
          cd "$HOME/.cache/ms-playwright"
          tar -czf /tmp/aquastone-browser-chromium.tar.gz chromium-* chromium_headless_shell-* ffmpeg-* || true
          tar -czf /tmp/aquastone-browser-firefox.tar.gz firefox-*
          tar -czf /tmp/aquastone-browser-webkit.tar.gz webkit-*
      - name: Upload node runtime
        uses: actions/upload-artifact@v4
        with:
          name: aquastone-node-runtime
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          path: /tmp/aquastone-node-runtime.tar.gz
      - name: Upload Chromium runtime
        uses: actions/upload-artifact@v4
        with:
          name: aquastone-browser-chromium-runtime
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          path: /tmp/aquastone-browser-chromium.tar.gz
      - name: Upload Firefox runtime
        uses: actions/upload-artifact@v4
        with:
          name: aquastone-browser-firefox-runtime
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          path: /tmp/aquastone-browser-firefox.tar.gz
      - name: Upload WebKit runtime
        uses: actions/upload-artifact@v4
        with:
          name: aquastone-browser-webkit-runtime
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          path: /tmp/aquastone-browser-webkit.tar.gz
