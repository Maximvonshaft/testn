name: QA source export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-webkit-compatibility-libs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install WebKit system dependencies
        run: pnpm exec playwright install --with-deps webkit
      - name: Collect exact Ubuntu runtime libraries missing from the isolated Debian QA host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/webkit-compat/lib
          patterns=(
            'libgtk-4.so.1*'
            'libgraphene-1.0.so.0*'
            'libicudata.so.74*'
            'libicui18n.so.74*'
            'libicuuc.so.74*'
            'libjpeg.so.8*'
            'libmanette-0.2.so.0*'
            'libsecret-1.so.0*'
            'libGLESv2.so.2*'
          )
          for pattern in "${patterns[@]}"; do
            found=0
            while IFS= read -r -d '' file; do
              cp -L "$file" "/tmp/webkit-compat/lib/$(basename "$file")"
              found=1
            done < <(find /usr/lib /lib -type f -o -type l 2>/dev/null | grep -zE "/${pattern//./\.}$" || true)
            if [[ "$found" == 0 ]]; then
              while IFS= read -r file; do
                [[ -n "$file" ]] || continue
                cp -L "$file" "/tmp/webkit-compat/lib/$(basename "$file")"
                found=1
              done < <(find /usr/lib /lib -name "$pattern" -print 2>/dev/null)
            fi
            [[ "$found" == 1 ]] || { echo "Missing expected pattern: $pattern" >&2; exit 1; }
          done
          (cd /tmp/webkit-compat/lib && sha256sum * | sort) > /tmp/webkit-compat/SHA256SUMS
          tar -C /tmp/webkit-compat -czf /tmp/aquastone-webkit-compat-libs.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: aquastone-webkit-compat-libs
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          path: /tmp/aquastone-webkit-compat-libs.tar.gz
