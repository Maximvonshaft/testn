name: Deploy AQUASTONE to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
  PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
  PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
  PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
  PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET }}
  TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
  LEAD_WEBHOOK_URL: ${{ secrets.LEAD_WEBHOOK_URL }}
  LEAD_WEBHOOK_BEARER_TOKEN: ${{ secrets.LEAD_WEBHOOK_BEARER_TOKEN }}
  SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

jobs:
  deploy:
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PUBLIC_SITE_URL"
          test -n "$PUBLIC_TURNSTILE_SITE_KEY"
          test -n "$TURNSTILE_SECRET_KEY"
          test -n "$LEAD_WEBHOOK_URL"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm qa
      - name: Deploy immutable accepted build
        run: pnpm deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
