name: Harden AQUASTONE Studio dependencies

on:
  push:
    branches:
      - feat/aquastone-astro-production

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aquastone-astro-production
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Apply patched transitive dependency floors
        shell: bash
        run: |
          set -euo pipefail
          cat > pnpm-workspace.yaml <<'YAML'
          packages:
            - .
            - studio
          allowBuilds:
            esbuild: true
            workerd: true
          overrides:
            adm-zip: 0.6.0
            js-yaml@3: 3.15.0
            smol-toml: 1.6.1
            uuid@10: 11.1.1
          YAML
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
      - name: Verify full workspace and Studio
        shell: bash
        env:
          PUBLIC_SITE_URL: https://preview.aquastone.example
          PUBLIC_SANITY_DATASET: production
        run: |
          set -euo pipefail
          pnpm test:unit
          pnpm check
          pnpm build
          pnpm --filter aquastone-studio build
          pnpm audit --prod --audit-level=high
      - name: Commit hardened lock
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/harden-studio-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-workspace.yaml pnpm-lock.yaml .github/workflows/harden-studio-deps.yml
          git commit -m "fix: harden Sanity Studio transitive dependencies"
          git push origin HEAD:feat/aquastone-astro-production
