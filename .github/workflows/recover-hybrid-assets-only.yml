name: Recover authoritative hybrid visual bundle

on:
  push:
    branches: [feat/hybrid-visual-system-final]
    paths: [.github/workflows/recover-hybrid-assets-only.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-authoritative-hybrid-assets
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hybrid-visual-system-final
          fetch-depth: 0
      - name: Restore and verify bundle
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin feat/hybrid-visual-system-v2:refs/remotes/origin/feat/hybrid-visual-system-v2
          rm -f src/assets-packed/visual-bundle.aqv.b64.* src/assets-packed/visual-bundle-v2.aqv.b64.*
          mapfile -t chunks < <(git ls-tree -r --name-only origin/feat/hybrid-visual-system-v2 -- src/assets-packed | grep 'visual-bundle\.aqv\.b64\.' | sort || true)
          for path in "${chunks[@]}"; do
            git show "origin/feat/hybrid-visual-system-v2:${path}" > "$path"
          done
          mkdir -p qa-evidence
          {
            echo "recovered_count=${#chunks[@]}"
            printf '%s\n' "${chunks[@]}"
          } > qa-evidence/hybrid-recovery-status.txt
          set +e
          node scripts/materialize-visual-assets.mjs > qa-evidence/hybrid-recovery-materialize.log 2>&1
          status=$?
          set -e
          echo "materialize_status=${status}" >> qa-evidence/hybrid-recovery-status.txt
          if [ "$status" -eq 0 ]; then
            echo 'result=PASS' >> qa-evidence/hybrid-recovery-status.txt
          else
            echo 'result=FAIL' >> qa-evidence/hybrid-recovery-status.txt
          fi
          git rm -f .github/workflows/recover-hybrid-assets-only.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "assets: restore authoritative hybrid bundle (${status})"
          for attempt in 1 2 3 4 5; do
            git fetch origin feat/hybrid-visual-system-final
            git rebase origin/feat/hybrid-visual-system-final || { git rebase --abort || true; sleep 2; continue; }
            if git push origin HEAD:feat/hybrid-visual-system-final; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
