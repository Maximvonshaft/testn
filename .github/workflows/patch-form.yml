name: Apply AQUASTONE form routing hardening

on:
  push:
    branches:
      - feat/aquastone-production-website

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aquastone-production-website
          fetch-depth: 0
      - name: Support Netlify custom domains without breaking previews
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          source = path.read_text(encoding='utf-8')
          start = source.index("      const isNetlify = /\\.netlify\\.app$/")
          end_marker = "      }\n    });\n  }\n\n  function bindReveal()"
          end = source.index(end_marker, start)
          replacement = """      const isUnsupportedPreview =
        location.protocol === 'file:' ||
        /^(localhost|127\\.0\\.0\\.1|\\[::1\\])$/.test(location.hostname) ||
        /\\.github\\.io$/.test(location.hostname);
      const hasNetlifyContract = form.dataset.netlify === 'true';
      if (!hasNetlifyContract || isUnsupportedPreview) {
        event.preventDefault();
        status.textContent = 'This preview has no live form endpoint. Deploy the repository on Netlify to activate secure form delivery.';
        status.dataset.state = 'warning';
        emit('form-unavailable', { hostname: location.hostname });
      }
    });
  }

  function bindReveal()"""
          path.write_text(source[:start] + replacement + source[end + len(end_marker):], encoding='utf-8')
          PY
          node --check app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: support Netlify custom-domain form delivery"
          git push origin HEAD:feat/aquastone-production-website
